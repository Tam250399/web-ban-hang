services:
  postgres:
    image: postgres:16-alpine
    container_name: web-ban-hang-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: SalesManagerDb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: web-ban-hang-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # Backend .NET 8 Web API. Trước đây chạy bằng `dotnet run` ngoài Docker —
  # giờ đóng gói thành container để chạy production trên VM Proxmox mà không
  # cần cài .NET SDK trực tiếp lên VM.
  backend:
    build:
      context: ./Backend/SalesManagerBE
    container_name: web-ban-hang-be
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=SalesManagerDb;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: SalesManagerBE
      Jwt__Audience: SalesManagerFE
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__UseSSL: "false"
      AdminBootstrap__Password: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Web bán hàng: nginx phục vụ file tĩnh đã build + forward /api, /chathub,
  # /media sang backend và MinIO. Thiếu lớp này thì bản build gọi /api sẽ 404
  # vì proxy của Vite chỉ tồn tại lúc `npm run dev`.
  web:
    build:
      context: ./Frontend/sales-manager-fe
      args:
        # Để trống -> web gọi /api cùng origin, nginx lo phần forward.
        VITE_API_URL: ""
        VITE_MEDIA_URL: "/media"
    container_name: web-ban-hang-fe
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://backend:5000
      MINIO_URL: http://minio:9000
    depends_on:
      - backend
      - minio
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
